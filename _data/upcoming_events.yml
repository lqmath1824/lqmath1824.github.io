# Upcoming events displayed on the About page.
# Events are shown in the order listed here.
# Remove an event once its date has passed.
# Fields:
#   title      — talk title or event name (required)
#   conference — name of the conference / workshop / seminar (optional)
#   location   — city, country or institution (optional)
#   date       — ISO date YYYY-MM-DD (required)
#   type       — e.g. Invited Talk, Contributed Talk, Poster, Participant (optional)
#   url        — link to conference page / slides (optional)
